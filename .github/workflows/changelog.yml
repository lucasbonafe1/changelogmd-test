
name: Generate Changelog

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: changelog-release
  cancel-in-progress: false

jobs:
  generate-changelog:
    name: Generate and Publish Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Changelog
        env:
          DEFAULT_BRANCH: main
          DEVELOP_BRANCH: develop
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/changelog/generate_changelog.py

      - name: Commit Changelog
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "docs(changelog): atualiza versão ${{ github.ref_name }}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          else
            echo "Nenhuma alteração no CHANGELOG.md"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file RELEASE_NOTES.md
          fi
