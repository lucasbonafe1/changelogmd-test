name: Generate Changelog

# Executado manualmente (Actions > Generate Changelog > Run workflow)
# quando o cliente aprovou os itens em HML e a subida para PRD foi liberada.
# Roda na branch `release`, ANTES do merge na main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão de PRD (ex.: 1.1.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: changelog-release
  cancel-in-progress: false

jobs:
  generate-changelog:
    name: Generate and Publish Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0   # necessário para histórico completo e tags

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: '$VERSION'. Use o formato X.Y.Z"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "A tag $VERSION já existe."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Changelog
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          # JIRA_BASE_URL: https://SUA-EMPRESA.atlassian.net/browse
        run: python scripts/changelog/generate_changelog.py

      - name: Commit changelog and create tag on release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "docs(changelog): atualiza versão ${VERSION}"
          fi

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:release "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file RELEASE_NOTES.md \
            --target release
