name: Generate Changelog

# Roda sempre que a main recebe push (merge da release, hotfix finish...).
# Também roda no push de tag: se a tag chegar depois do merge, ela é
# processada na mesma hora. A execução é idempotente: se não há versão
# nova (tag) sem entrada no CHANGELOG.md, não faz nada.
on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  generate-changelog:
    name: Generate and Publish Changelog
    runs-on: ubuntu-latest

    # Evita reprocessar o commit do próprio bot.
    if: ${{ !startsWith(github.event.head_commit.message, 'docs(changelog)') }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # histórico completo + tags

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Changelog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python scripts/changelog/generate_changelog.py

      - name: Check generated versions
        id: versions
        run: |
          if [ -s .release-notes/versions.txt ]; then
            echo "has_versions=true" >> "$GITHUB_OUTPUT"
            echo "Versões geradas:"
            cat .release-notes/versions.txt
          else
            echo "has_versions=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nenhuma tag nova para documentar. Se este merge é uma entrega, crie a tag X.Y.Z na release e dê push."
          fi

      - name: Commit changelog on main
        if: steps.versions.outputs.has_versions == 'true'
        run: |
          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no CHANGELOG.md"
          else
            git commit -m "docs(changelog): atualiza $(paste -sd, .release-notes/versions.txt)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Sync CHANGELOG.md to develop
        if: steps.versions.outputs.has_versions == 'true'
        continue-on-error: true   # develop pode ser protegida; não derruba a execução
        run: |
          git fetch origin develop
          git checkout -B develop origin/develop
          git checkout main -- CHANGELOG.md

          if git diff --cached --quiet; then
            echo "develop já está sincronizada"
          else
            git commit -m "docs(changelog): sincroniza com a main"
            git push origin develop
          fi

          git checkout main

      - name: Publish GitHub Releases
        if: steps.versions.outputs.has_versions == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while read -r version; do
            [ -z "$version" ] && continue

            if gh release view "$version" >/dev/null 2>&1; then
              gh release edit "$version" \
                --title "$version" \
                --notes-file ".release-notes/${version}.md"
            else
              gh release create "$version" \
                --title "$version" \
                --notes-file ".release-notes/${version}.md" \
                --verify-tag
            fi
          done < .release-notes/versions.txt